<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
  </head>
  <body>
    <script>
      // Map of short paths → destination URLs
      const redirects = {
        "/print": "https://theyeisblind.substack.com/p/the-eyes-is-blind-that-will-not-see",
        "/art": "https://theyeisblind.substack.com/p/the-eyes-is-blind-that-will-not-see",
        "/print": "https://theyeisblind.substack.com/p/the-eyes-is-blind-that-will-not-see",
        "/whatsapp": "https://theyeisblind.substack.com/p/the-eyes-is-blind-that-will-not-see",
        "/telegram": "https://theyeisblind.substack.com/p/the-eyes-is-blind-that-will-not-see",
        "/raad": "https://theyeisblind.substack.com/p/the-eyes-is-blind-that-will-not-see"
      };

      // Normalize path (strip trailing slash)
      const path = window.location.pathname.replace(/\/+$/, "").toLowerCase() || "/";

      if (redirects[path]) {
        window.location.replace(redirects[path]);
      } else {
        // Fallback: show a normal 404 message
        document.body.innerHTML = `
          <h1>404 – Not found</h1>
          <p>No shortlink defined for <code>${path}</code>.</p>
        `;
      }
    </script>
  </body>
</html>
